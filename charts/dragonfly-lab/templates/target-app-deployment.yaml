apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app

spec:
  replicas: {{ .Values.targetApp.replicaCount }}

  selector:
    matchLabels:
      app: target-app

  template:
    metadata:
      labels:
        app: target-app

    spec:
      containers:
        - name: target-app
          image: "{{ .Values.targetApp.image.repository }}:{{ .Values.targetApp.image.tag }}"
          imagePullPolicy: {{ .Values.targetApp.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.targetApp.service.port }}

          env:
            - name: PORT
              value: "{{ .Values.targetApp.service.port }}"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: database-url

            - name: DRAGONFLY_URL
              value: "redis://dragonfly:6379"

            - name: CACHE_TTL_SECONDS
              value: "{{ .Values.targetApp.cacheTtlSeconds }}"

            - name: PG_POOL_MAX
              value: "{{ .Values.targetApp.pgPoolMax }}"
